AWSTemplateFormatVersion: '2010-09-09'
Description: BIT production website with a private S3 origin and CloudFront delivery.

Parameters:
  DomainName:
    Type: String
    Default: building-insights.org
    AllowedPattern: '^([a-z0-9](-*[a-z0-9])*\.)+[a-z]{2,}$'
    Description: Canonical production hostname.
  WwwDomainName:
    Type: String
    Default: www.building-insights.org
    AllowedPattern: '^([a-z0-9](-*[a-z0-9])*\.)+[a-z]{2,}$'
    Description: WWW hostname served during cutover and redirected after verification.
  LegacyDomainName:
    Type: String
    Default: beta.building-insights.org
    AllowedPattern: '^([a-z0-9](-*[a-z0-9])*\.)+[a-z]{2,}$'
    Description: Previous beta hostname retained as a permanent redirect after cutover.
  CertificateArn:
    Type: String
    MinLength: 20
    Description: ACM certificate ARN in us-east-1 covering the canonical and alternate hostnames.
  EnableCanonicalRedirects:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Redirect WWW and legacy hostnames to the canonical production hostname.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: BITWebsite
        - Key: Environment
          Value: production

  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3'
        Description: Signed read access to the private BIT website bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-site'
        Comment: Compressed static content with short revalidation windows.
        DefaultTTL: 300
        MinTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true

  ResponseHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-headers'
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=()
              Override: true

  AppRoutes:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-routes'
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve clean routes and optionally enforce the canonical hostname.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function querySuffix(querystring) {
          var pairs = [];
          for (var key in querystring) {
            var item = querystring[key];
            var encodedKey = encodeURIComponent(key);
            if (item.multiValue) {
              for (var index = 0; index < item.multiValue.length; index += 1) {
                pairs.push(encodedKey + '=' + encodeURIComponent(item.multiValue[index].value));
              }
            } else {
              pairs.push(encodedKey + '=' + encodeURIComponent(item.value || ''));
            }
          }
          return pairs.length ? '?' + pairs.join('&') : '';
        }

        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value.toLowerCase() : '';
          if ('${EnableCanonicalRedirects}' === 'true' &&
              (host === '${LegacyDomainName}' || host === '${WwwDomainName}')) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: {
                  value: 'https://${DomainName}' + request.uri + querySuffix(request.querystring || {})
                },
                'cache-control': { value: 'public, max-age=3600' }
              }
            };
          }

          var uri = request.uri;
          if (uri.endsWith('/')) request.uri += 'index.html';
          else if (uri.substring(uri.lastIndexOf('/') + 1).indexOf('.') === -1) request.uri += '/index.html';
          return request;
        }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: BIT production website
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
          - !Ref WwwDomainName
          - !Ref LegacyDomainName
        Origins:
          - Id: SiteBucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: SiteBucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref SiteCachePolicy
          ResponseHeadersPolicyId: !Ref ResponseHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt AppRoutes.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - Key: Project
          Value: BITWebsite
        - Key: Environment
          Value: production

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref SiteDistribution
  DistributionDomainName:
    Value: !GetAtt SiteDistribution.DomainName
  SiteUrl:
    Value: !Sub 'https://${DomainName}'
